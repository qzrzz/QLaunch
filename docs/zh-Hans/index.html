    <script>
      (function () {
        try {
          var path = window.location.pathname;
          var isExplicitSubpath = path.indexOf("/zh-Hans") !== -1;
          if (isExplicitSubpath) {
            localStorage.setItem("qlaunchpad_lang", "zh-Hans");
            return;
          }
          var saved = localStorage.getItem("qlaunchpad_lang");
          var targetLang = saved;
          if (!targetLang) {
            var langs = navigator.languages || (navigator.language ? [navigator.language] : []);
            for (var i = 0; i < langs.length; i++) {
              var l = (langs[i] || "").toLowerCase();
              if (l.indexOf("zh") === 0) {
                targetLang = "zh-Hans";
                break;
              }
              if (l.indexOf("en") === 0) {
                targetLang = "en";
                break;
              }
            }
          }
          if (targetLang === "zh-Hans") {
            window.location.replace(
              "./zh-Hans/" + window.location.search + window.location.hash
            );
          }
        } catch (e) {}
      })();
    </script>
